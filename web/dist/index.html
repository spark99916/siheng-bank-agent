<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>司衡 · 银行智能体</title>
    
    
    <style>

  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topbar__brand">
          <strong>司衡</strong>
          <span>银行智能体</span>
        </div>
        <div class="topbar__status">
          <label class="control">
            主体
            <select id="tier">
              <option value="standard">普通客户</option>
              <option value="gold">金卡客户</option>
              <option value="private">私行客户</option>
            </select>
          </label>
          <label class="control" title="把单笔限额压到 500 元、首次收款人红线压到 100 元，用来看判定是不是可配置">
            <input id="strict" type="checkbox" />
            严格策略
          </label>
          <span id="track">通道：准备中</span>
          <span id="model">本地 · 不调模型</span>
          <!-- 演示站：单文件静态页，讲清楚每个判定是怎么来的。 -->
          <a class="topbar__link" href="./demo.html" target="_blank" rel="noopener">演示站 ↗</a>
        </div>
      </header>

      <main class="main">
        <section class="chat">
          <div id="messages" class="messages">
            <div class="hint">
              <p>说一句话办一笔业务。</p>
              <p class="hint__sub">试试：查一下余额 / 转给小王 100 元 / 买稳盈货币 A 1000 元 / 先查一下余额，然后把云端音乐取消</p>
              <p class="hint__sub">换上面「主体」或勾上「严格策略」再发同样的话，判定颜色会变 —— 规则是可配置的，不是写死的。</p>
            </div>
          </div>
          <form id="composer" class="composer">
            <input id="input" type="text" placeholder="例如：转给小王 100 元" autocomplete="off" />
            <button type="submit">发送</button>
          </form>
        </section>

        <aside class="side">
          <section class="card">
            <h2>账户</h2>
            <dl id="account" class="kv">
              <div><dt>可用余额</dt><dd>—</dd></div>
            </dl>
          </section>

          <section class="card">
            <h2>审计</h2>
            <div id="chain" class="chain">等待记录</div>
            <button id="tamper" class="ghost ghost--wide" type="button">改掉最后一条，看链会不会断</button>
            <ol id="audit" class="audit"></ol>
          </section>
        </aside>
      </main>
    </div>
  <script>
      /* 看门狗：正常情况下引擎几秒内把自己接上，「通道：准备中」会变成「本地引擎」。
         如果 8 秒后还停在「准备中」，说明主脚本根本没跑起来 —— 与其让人对着一个
         永远不变的占位符猜，不如把抓到的真实错误直接写到页面上。
         这段故意用最老的 ES5 语法写：哪怕主脚本因为浏览器太旧没被解析，这里也必须能跑。 */

          el.style.color = "#f85149";
          var box = document.createElement("div");
          box.style.cssText = "margin:16px;padding:14px 18px;border:1px solid #f85149;border-radius:10px;font:14px/1.7 system-ui,sans-serif;line-height:1.8";
          var why = detail || "";
          if (window.__sihengError) why += " 抓到的报错：" + String(window.__sihengError);
          box.textContent = "页面引擎没有启动。" + why +
            " 常见原因：这个文件被放在了不完整的环境里打开（例如聊天窗口的预览面板、微信内置浏览器），或浏览器内核太旧不支持本页语法。请把文件保存到本地后，用较新版本的 Chrome 或 Edge 双击打开。";
          document.body.insertBefore(box, document.body.firstChild);
        }
        setTimeout(function () {
          if (window.__sihengBooted !== true) fail("8 秒内没有等到引擎就绪。");
        }, 8000);
      })();
    </script>
